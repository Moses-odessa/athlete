name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Кодоген Drift и локализаций — чтобы CI использовал свежие файлы.
      - name: Code generation (Drift, l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      # Критерий приёмки ТЗ 17: покрытие модуля scoring ≥ 90%.
      - name: Enforce scoring coverage >= 90%
        run: |
          awk '
          /^SF:/ { f=$0; sub("^SF:","",f) }
          /^LF:/ { lf=substr($0,4)+0 }
          /^LH:/ { lh=substr($0,4)+0; if (f ~ /domain\/scoring\//) { tot+=lf; hit+=lh } }
          END {
            pct = (tot>0) ? 100*hit/tot : 0
            printf "scoring coverage: %.1f%% (%d/%d)\n", pct, hit, tot
            if (pct < 90) { print "FAIL: scoring coverage below 90%"; exit 1 }
          }' coverage/lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    needs: analyze-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Code generation (Drift, l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build web (release)
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
